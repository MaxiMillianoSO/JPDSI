<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <meta charset="utf-8" />
        <title>Lista zwierząt</title>
    </h:head>

    <h:body style="background-color: #eee; margin: 0.5em;">

        <p:panel header="Opcje wyszukiwania" toggleable="true" collapsed="true"
                 style="margin-bottom: 1em;">
            <h:form>
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel value="Imię zwierzęcia:" />
                    <p:inputText value="#{zwierzeListBB.imie}" />

                    <h:outputLabel value="Gatunek:" />
                    <p:inputText value="#{zwierzeListBB.gatunek}" />

                    <p:commandButton value="Szukaj" update="form-table" />
                </h:panelGrid>
            </h:form>
        </p:panel>

        <p:messages />

        <h:form id="form-table" style="margin-bottom:1em;">

            <p:commandButton value="Dodaj nowe zwierzę" style="margin-bottom:1em;"
                             action="#{zwierzeListBB.newZwierze()}"/>

            <p:dataTable value="#{zwierzeListBB.list}" var="z">

                <p:column>
                    <f:facet name="header">Gatunek</f:facet>
                    <h:outputText value="#{z.gatunek}" />
                </p:column>

                <p:column>
                    <f:facet name="header">Imię</f:facet>
                    <h:outputText value="#{z.imie}" />
                </p:column>

                <p:column>
                    <f:facet name="header">Rasa</f:facet>
                    <h:outputText value="#{z.rasa}" />
                </p:column>

                <p:column>
                    <f:facet name="header">Wiek</f:facet>
                    <h:outputText value="#{z.wiek}" />
                </p:column>

                <p:column>
                    <f:facet name="header">Opcje</f:facet>

                    <p:commandButton value="Edytuj"
                                     action="#{zwierzeListBB.editZwierze(z)}"
                                     style="margin-right: 0.5em"/>

                    <p:commandButton value="Usuń"
                                     action="#{zwierzeListBB.deleteZwierze(z)}"
                                     update="@form"
                                     style="margin-right: 0.5em" />

                    <p:button outcome="zwierzeEditGET" value="Edytuj (GET)">
                        <f:param name="z" value="#{z.id}" />
                    </p:button>

                </p:column>

            </p:dataTable>
        </h:form>

    </h:body>
</html>
