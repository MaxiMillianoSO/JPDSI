<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">

    <h:head>
        <title>My posts</title>
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>

        <ui:include src="/templates/header.xhtml" />

        <p:confirmDialog global="true"
                         showEffect="fade"
                         hideEffect="fade">

            <p:commandButton value="Yes"
                             type="button"
                             styleClass="ui-confirmdialog-yes ui-button-danger"
                             icon="pi pi-check" />

            <p:commandButton value="No"
                             type="button"
                             styleClass="ui-confirmdialog-no ui-button-secondary"
                             icon="pi pi-times" />
        </p:confirmDialog>

        <div class="page-content">

            <h1>My posts</h1>

            <h:form>
                <p:commandButton value="Create new post"
                                 ajax="false"
                                 action="/pages/createPost.xhtml?faces-redirect=true"
                                 style="margin-bottom:20px"/>
            </h:form>

            <h:form id="postsForm">

                <ui:repeat value="#{myPostsBB.myPosts}" var="post">

                    <div style="border:1px solid #ddd;
                         padding:15px;
                         margin-bottom:15px;
                         border-radius:6px">

                        <h2>#{post.title}</h2>
                        <h4 style="color:#555">#{post.subtitle}</h4>

                        <h:link outcome="/pages/editPost.xhtml"
                                styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-secondary action-btn"
                                style="text-decoration:none; margin-right:8px">

                            <i class="pi pi-pencil" style="margin-right:6px"></i>
                            Edit
                            <f:param name="id" value="#{post.id}" />
                        </h:link>


                        <p:commandButton value="Delete"
                                         styleClass="ui-button-danger action-btn"
                                         rendered="#{myPostsBB.canDelete(post)}"
                                         process="@this"
                                         update="postsForm"
                                         action="#{myPostsBB.delete(post.id)}">

                            <p:confirm header="Confirm delete"
                                       message="Are you sure you want to delete this post?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>


                    </div>

                </ui:repeat>

            </h:form>

        </div>

    </h:body>
</ui:composition>
