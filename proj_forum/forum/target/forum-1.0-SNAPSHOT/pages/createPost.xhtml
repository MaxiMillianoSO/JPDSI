<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title>Create post</title>
        <h:outputStylesheet library="css" name="style.css" />
    </h:head>

    <h:body>

        <ui:include src="/templates/header.xhtml" />

        <div class="page-content">

            <h:link value="← Back"
                    outcome="/pages/myPosts.xhtml" />

            <h2>Create new post</h2>

            <h:form>

                <p:inputText value="#{createPostBB.title}"
                             maxlength="60"
                             placeholder="Title"
                             required="true"
                             style="width:100%"/>

                <br/><br/>

                <p:inputText value="#{createPostBB.subtitle}"
                             maxlength="150"
                             placeholder="Subtitle"
                             required="true"
                             style="width:100%"/>

                <br/><br/>

                <p:inputTextarea value="#{createPostBB.content}"
                                 placeholder="Content"
                                 autoResize="true"
                                 style="width:100%"/>

                <br/><br/>

                <p:commandButton value="Publish"
                                 ajax="false"
                                 action="#{createPostBB.publish}"/>

            </h:form>

        </div>

    </h:body>
</ui:composition>
